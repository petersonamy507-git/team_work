<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Crewdesk sign-in background. Animated with SMIL so it moves even as a CSS background image. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162a"/>
      <stop offset=".55" stop-color="#262a5e"/>
      <stop offset="1" stop-color="#4048a6"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".2" cy=".25" r=".45">
      <stop offset="0" stop-color="#6b7cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".8" r=".45">
      <stop offset="0" stop-color="#e8378f" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e8378f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)">
    <animate attributeName="opacity" values="1;.6;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="1920" height="1080" fill="url(#glow1)">
    <animate attributeName="opacity" values=".7;1;.7" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="1920" height="1080" fill="url(#glow2)">
    <animate attributeName="opacity" values="1;.6;1" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- connecting lines with flowing dashes -->
  <g stroke="#9aa6ff" stroke-opacity=".22" stroke-width="2" fill="none" stroke-dasharray="10 14">
    <path d="M150 860 C 420 760, 520 940, 760 830"><animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/></path>
    <path d="M1180 230 C 1380 120, 1520 300, 1780 190"><animate attributeName="stroke-dashoffset" from="0" to="240" dur="7s" repeatCount="indefinite"/></path>
    <path d="M1200 980 C 1420 880, 1560 1010, 1820 900"><animate attributeName="stroke-dashoffset" from="0" to="-240" dur="8s" repeatCount="indefinite"/></path>
  </g>

  <!-- KANBAN BOARD (top-left): floats, progress fills, a card travels To do -> Doing -> Done -->
  <g transform="translate(110 110) rotate(-6)" filter="url(#soft)" opacity=".92">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 -14; 0 0" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    <rect width="520" height="330" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="22" y="22" width="130" height="10" rx="5" fill="#ffffff" fill-opacity=".35"/>
    <g transform="translate(22 52)">
      <rect width="148" height="256" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <rect x="12" y="12" width="60" height="10" rx="5" fill="#94a3b8" fill-opacity=".7"/>
      <rect x="10" y="34" width="128" height="58" rx="9" fill="#ffffff" fill-opacity=".9"/><rect x="22" y="48" width="86" height="8" rx="4" fill="#c7cde0"/><rect x="22" y="66" width="52" height="8" rx="4" fill="#e1e6ee"/>
      <circle cx="120" cy="76" r="8" fill="#e8378f"><animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/></circle>
      <rect x="10" y="102" width="128" height="58" rx="9" fill="#ffffff" fill-opacity=".9"/><rect x="22" y="116" width="96" height="8" rx="4" fill="#c7cde0"/><rect x="22" y="134" width="40" height="8" rx="4" fill="#ffd27a"/><circle cx="120" cy="144" r="8" fill="#4461d7"/>
    </g>
    <g transform="translate(186 52)">
      <rect width="148" height="256" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <rect x="12" y="12" width="74" height="10" rx="5" fill="#6b8cff" fill-opacity=".85"/>
      <rect x="10" y="34" width="128" height="58" rx="9" fill="#ffffff" fill-opacity=".9"/><rect x="22" y="48" width="70" height="8" rx="4" fill="#c7cde0"/><rect x="22" y="66" width="90" height="6" rx="3" fill="#e1e6ee"/>
      <rect x="22" y="66" width="54" height="6" rx="3" fill="#4461d7"><animate attributeName="width" values="10;90;90;10" keyTimes="0;.6;.85;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="10" y="102" width="128" height="58" rx="9" fill="#ffffff" fill-opacity=".9"/><rect x="22" y="116" width="92" height="8" rx="4" fill="#c7cde0"/><rect x="22" y="134" width="60" height="8" rx="4" fill="#e1e6ee"/><circle cx="120" cy="144" r="8" fill="#22b573"/>
      <rect x="10" y="170" width="128" height="58" rx="9" fill="#ffffff" fill-opacity=".9"/><rect x="22" y="184" width="64" height="8" rx="4" fill="#c7cde0"/><rect x="22" y="202" width="34" height="8" rx="4" fill="#ffb3c7"/>
    </g>
    <g transform="translate(350 52)">
      <rect width="148" height="256" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <rect x="12" y="12" width="56" height="10" rx="5" fill="#22b573" fill-opacity=".85"/>
      <rect x="10" y="34" width="128" height="58" rx="9" fill="#ffffff" fill-opacity=".9"/><rect x="22" y="48" width="80" height="8" rx="4" fill="#c7cde0"/>
      <path d="M110 70 l7 7 l13 -15" stroke="#22b573" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="32" stroke-dashoffset="32">
        <animate attributeName="stroke-dashoffset" values="32;0;0;32" keyTimes="0;.25;.85;1" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- travelling card -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;.08;.4;.7;.92;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="32 248; 32 248; 196 248; 196 248; 360 168; 360 168" keyTimes="0;.18;.42;.58;.82;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; .5 0 .3 1; 0 0 1 1; .5 0 .3 1; 0 0 1 1"/>
      <rect width="128" height="50" rx="9" fill="#ffffff" stroke="#6b8cff" stroke-width="2"/>
      <rect x="12" y="13" width="80" height="8" rx="4" fill="#c7cde0"/><rect x="12" y="29" width="46" height="8" rx="4" fill="#b9c6ff"/>
      <circle cx="110" cy="33" r="7" fill="#ffc94d"/>
    </g>
  </g>

  <!-- GANTT / TIMELINE (top-right): bars grow, today line sweeps, milestone pulses -->
  <g transform="translate(1290 120) rotate(5)" filter="url(#soft)" opacity=".9">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 12; 0 0" dur="9s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    <rect width="500" height="270" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="24" y="24" width="120" height="10" rx="5" fill="#ffffff" fill-opacity=".35"/>
    <g stroke="#ffffff" stroke-opacity=".08"><path d="M150 56 V246 M230 56 V246 M310 56 V246 M390 56 V246 M470 56 V246"/></g>
    <g fill="#ffffff" fill-opacity=".3"><rect x="24" y="72" width="90" height="9" rx="4"/><rect x="24" y="112" width="70" height="9" rx="4"/><rect x="24" y="152" width="100" height="9" rx="4"/><rect x="24" y="192" width="80" height="9" rx="4"/></g>
    <rect x="160" y="66" width="150" height="22" rx="11" fill="#6b8cff"><animate attributeName="width" values="40;150;150;40" keyTimes="0;.35;.85;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="230" y="106" width="130" height="22" rx="11" fill="#e8378f" fill-opacity=".9"><animate attributeName="width" values="30;130;130;30" keyTimes="0;.45;.85;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="300" y="146" width="160" height="22" rx="11" fill="#ffc94d"><animate attributeName="width" values="30;160;160;30" keyTimes="0;.55;.85;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="200" y="186" width="110" height="22" rx="11" fill="#22b573"><animate attributeName="width" values="20;110;110;20" keyTimes="0;.4;.85;1" dur="7s" repeatCount="indefinite"/></rect>
    <path d="M0 50 V250" stroke="#ff6b81" stroke-width="2" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="translate" values="300 0; 400 0; 300 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M378 196 l10 -10 l10 10 l-10 10z" fill="#c7b8ff">
      <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- REPORT (bottom-left): donut fills and turns, bars grow -->
  <g transform="translate(150 700) rotate(4)" filter="url(#soft)" opacity=".9">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 -12; 0 0" dur="7.5s" begin="-3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    <rect width="420" height="250" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <g transform="translate(110 130)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="26"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle r="62" fill="none" stroke="#6b8cff" stroke-width="26" stroke-dasharray="180 390" transform="rotate(-90)"><animate attributeName="stroke-dasharray" values="20 390;180 390;180 390;20 390" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle r="62" fill="none" stroke="#22b573" stroke-width="26" stroke-dasharray="110 390" stroke-dashoffset="-180" transform="rotate(-90)"><animate attributeName="stroke-dasharray" values="10 390;110 390;110 390;10 390" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle r="62" fill="none" stroke="#e8378f" stroke-width="26" stroke-dasharray="70 390" stroke-dashoffset="-290" transform="rotate(-90)"><animate attributeName="stroke-dasharray" values="5 390;70 390;70 390;5 390" keyTimes="0;.6;.85;1" dur="6s" repeatCount="indefinite"/></circle>
      </g>
      <text y="8" text-anchor="middle" font-family="Inter, Arial" font-size="26" font-weight="700" fill="#ffffff" fill-opacity=".85">78%</text>
    </g>
    <g transform="translate(220 60)" fill="#ffffff">
      <rect x="0" y="100" width="26" height="70" rx="5" fill="#6b8cff"><animate attributeName="height" values="10;70;70;10" keyTimes="0;.3;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="160;100;100;160" keyTimes="0;.3;.85;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="42" y="60" width="26" height="110" rx="5" fill="#9aa9ff"><animate attributeName="height" values="10;110;110;10" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="160;60;60;160" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="84" y="30" width="26" height="140" rx="5" fill="#6b8cff"><animate attributeName="height" values="10;140;140;10" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="160;30;30;160" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="126" y="80" width="26" height="90" rx="5" fill="#9aa9ff"><animate attributeName="height" values="10;90;90;10" keyTimes="0;.6;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="160;80;80;160" keyTimes="0;.6;.85;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="0" y="180" width="152" height="3" rx="1.5" fill-opacity=".25"/>
    </g>
  </g>

  <!-- TEAM + CHAT (bottom-right): avatars bob, messages pop in, someone is typing -->
  <g transform="translate(1370 690) rotate(-4)" filter="url(#soft)" opacity=".92">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 14; 0 0" dur="8.5s" begin="-1s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    <rect width="400" height="250" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
    <g transform="translate(34 40)">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" repeatCount="indefinite"/><circle cx="22" cy="22" r="22" fill="#ffc94d"/><g fill="#ffffff" fill-opacity=".9"><circle cx="22" cy="17" r="7"/><path d="M8 38 a14 12 0 0 1 28 0z"/></g></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" begin=".3s" repeatCount="indefinite"/><circle cx="62" cy="22" r="22" fill="#6b8cff"/><g fill="#ffffff" fill-opacity=".9"><circle cx="62" cy="17" r="7"/><path d="M48 38 a14 12 0 0 1 28 0z"/></g></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" begin=".6s" repeatCount="indefinite"/><circle cx="102" cy="22" r="22" fill="#22b573"/><g fill="#ffffff" fill-opacity=".9"><circle cx="102" cy="17" r="7"/><path d="M88 38 a14 12 0 0 1 28 0z"/></g></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" begin=".9s" repeatCount="indefinite"/><circle cx="142" cy="22" r="22" fill="#e8378f"/><g fill="#ffffff" fill-opacity=".9"><circle cx="142" cy="17" r="7"/><path d="M128 38 a14 12 0 0 1 28 0z"/></g></g>
      <rect x="180" y="12" width="70" height="20" rx="10" fill="#ffffff" fill-opacity=".2"/>
      <g fill="#ffffff">
        <circle cx="200" cy="22" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="215" cy="22" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
        <circle cx="230" cy="22" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <g transform="translate(34 104)">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" repeatCount="indefinite"/>
        <rect width="230" height="44" rx="14" fill="#ffffff" fill-opacity=".9"/><rect x="16" y="13" width="150" height="8" rx="4" fill="#c7cde0"/><rect x="16" y="27" width="96" height="7" rx="3.5" fill="#e1e6ee"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.4;.9;1" dur="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0;0 0;0 0" keyTimes="0;.3;.4;.9;1" dur="6s" repeatCount="indefinite"/>
        <rect x="100" y="60" width="230" height="44" rx="14" fill="#6b8cff"/><rect x="116" y="73" width="160" height="8" rx="4" fill="#ffffff" fill-opacity=".85"/><rect x="116" y="87" width="90" height="7" rx="3.5" fill="#ffffff" fill-opacity=".55"/>
      </g>
    </g>
  </g>

  <!-- checklist: ticks draw one after another -->
  <g transform="translate(760 150)" opacity=".55">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 -10; 0 0" dur="6s" repeatCount="indefinite"/>
    <rect width="150" height="120" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <g stroke="#7ce0b0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="34">
      <path d="M22 36 l8 8 l14 -16" stroke-dashoffset="34"><animate attributeName="stroke-dashoffset" values="34;0;0;34" keyTimes="0;.2;.85;1" dur="5s" repeatCount="indefinite"/></path>
      <path d="M22 74 l8 8 l14 -16" stroke-dashoffset="34"><animate attributeName="stroke-dashoffset" values="34;34;0;0;34" keyTimes="0;.25;.45;.85;1" dur="5s" repeatCount="indefinite"/></path>
    </g>
    <rect x="58" y="32" width="70" height="9" rx="4.5" fill="#ffffff" fill-opacity=".4"/><rect x="58" y="70" width="56" height="9" rx="4.5" fill="#ffffff" fill-opacity=".4"/>
  </g>

  <!-- clock: hands keep turning -->
  <g transform="translate(1040 860)" opacity=".5">
    <circle r="56" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15" stroke-width="3"/>
    <path d="M0 0 V-34" stroke="#ffc94d" stroke-width="6" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 0 L22 14" stroke="#ffc94d" stroke-width="6" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="72s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#ffc94d"/>
  </g>

  <!-- milestone flag: waves -->
  <g transform="translate(700 880) rotate(-10)" opacity=".55">
    <path d="M0 0 V80" stroke="#ffffff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 4 H54 L42 22 L54 40 H0z" fill="#e8378f" fill-opacity=".8">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M0 4 C18 -2 36 10 54 4 L42 22 L54 40 C36 46 18 34 0 40z;
                M0 4 C18 10 36 -2 54 4 L44 22 L54 40 C36 34 18 46 0 40z;
                M0 4 C18 -2 36 10 54 4 L42 22 L54 40 C36 46 18 34 0 40z"/>
    </path>
  </g>

  <!-- twinkling sparks -->
  <g fill="#ffffff">
    <circle cx="1180" cy="470" r="6" opacity=".35"><animate attributeName="opacity" values=".1;.6;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="560" r="4" opacity=".35"><animate attributeName="opacity" values=".6;.1;.6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1520" cy="560" r="5" opacity=".3"><animate attributeName="opacity" values=".1;.5;.1" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="520" r="3" opacity=".3"><animate attributeName="opacity" values=".1;.6;.1" dur="2.2s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="1650" cy="470" r="3" opacity=".3"><animate attributeName="opacity" values=".5;.1;.5" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
